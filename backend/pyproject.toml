[project]
name = "flowpilot"
version = "0.0.0"
description = "AI destekli e-posta yönlendirme ve departman ajanı platformu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
    "google-genai>=3.6.1",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.34",
    "httpx2>=2.16.2",
]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "fpdf2>=2.9.0",
    "httpx2>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# MIMARI.md bağımlılık kuralları. Yeni departman eklendiğinde kural 2'nin
# modül listesine de eklenir.
[tool.importlinter]
root_package = "flowpilot"

[[tool.importlinter.contracts]]
name = "Kural 1: core departman modüllerini import etmez"
type = "forbidden"
source_modules = ["flowpilot.core"]
forbidden_modules = ["flowpilot.departments"]

[[tool.importlinter.contracts]]
name = "llm katmanı core ve departmanlardan bağımsızdır"
type = "forbidden"
source_modules = ["flowpilot.llm"]
forbidden_modules = ["flowpilot.core", "flowpilot.departments"]

[[tool.importlinter.contracts]]
name = "Kural 2: departman modülleri birbirini import etmez"
type = "independence"
modules = [
    "flowpilot.departments.procurement",
    "flowpilot.departments.finance",
    "flowpilot.departments.sales_orders",
    "flowpilot.departments.logistics",
]

[[tool.importlinter.contracts]]
name = "Departmanlar bileşim kökünü ve CLI'ı import etmez"
type = "forbidden"
source_modules = ["flowpilot.departments"]
forbidden_modules = ["flowpilot.bootstrap", "flowpilot.cli", "flowpilot.api", "flowpilot.worker"]

[[tool.importlinter.contracts]]
name = "core API katmanını, CLI'ı ve bileşim kökünü import etmez"
type = "forbidden"
source_modules = ["flowpilot.core"]
forbidden_modules = [
    "flowpilot.api",
    "flowpilot.cli",
    "flowpilot.bootstrap",
    "flowpilot.main",
    "flowpilot.worker",
]
