[project]
name = "flowpilot"
version = "0.0.0"
description = "AI destekli e-posta yönlendirme ve departman ajanı platformu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# MIMARI.md bağımlılık kuralları. Yeni departman eklendiğinde aşağıdaki
# "departments-independent" sözleşmesine eklenir.
[tool.importlinter]
root_package = "flowpilot"

[[tool.importlinter.contracts]]
name = "Kural 1: core departman modüllerini import etmez"
type = "forbidden"
source_modules = ["flowpilot.core"]
forbidden_modules = ["flowpilot.departments"]

[[tool.importlinter.contracts]]
name = "llm katmanı core ve departmanlardan bağımsızdır"
type = "forbidden"
source_modules = ["flowpilot.llm"]
forbidden_modules = ["flowpilot.core", "flowpilot.departments"]
